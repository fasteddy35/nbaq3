name: Q3 checkpoint collector

on:
  schedule:
    - cron: '7 * * * *'   # hourly; each run exits right away unless a game is live or tips within 90 min
  workflow_dispatch:

# One collector at a time: a new hourly trigger waits for the running one instead of double-pulling.
concurrency:
  group: q3-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect
        run: python q3_collector.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GIT_PUSH: '1'
